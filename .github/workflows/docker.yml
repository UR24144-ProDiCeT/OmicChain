name: docker

# Builds the reference image, tests it (real R packages, whole pipeline, application start), and
# publishes it to the GitHub Container Registry for the main branch and the release tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ur24144-prodicet/omicchain

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: omicchain:ci
          build-args: |
            OMICCHAIN_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: R and Python versions in the image
        run: |
          docker run --rm omicchain:ci Rscript -e 'cat(R.version.string, "\n"); for (p in c("DESeq2", "Rsubread", "clusterProfiler", "apeglm")) cat(p, as.character(packageVersion(p)), "\n")'
          docker run --rm omicchain:ci python --version

      - name: Tests with the real R packages (environment record, whole pipeline, verification)
        run: docker run --rm omicchain:ci test real

      - name: Tests of the application (mock R)
        run: docker run --rm omicchain:ci test fast

      - name: The application starts and answers
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          docker run -d --name omicchain -p 127.0.0.1:8501:8501 -v "$RUNNER_TEMP/work:/work" omicchain:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then echo "healthy after ${i} s"; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          test -f "$RUNNER_TEMP/work/OmicChain.py"
          test ! -e "$RUNNER_TEMP/work/.env"
          docker logs omicchain | tail -20
          docker rm -f omicchain

      - name: Registry login
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Publish
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OMICCHAIN_VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "### OmicChain image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
