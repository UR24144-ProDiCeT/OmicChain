# Tests with the real Rsubread (index building, alignment, counting, replay from the raw data) on
# small simulated genomes. Long (R + Bioconductor to install): run on main, weekly and on demand.
name: upstream-tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # The repository's .Rprofile activates renv (the user's pinned DESeq2 environment).
      # These tests only need Rsubread, installed below: renv is switched off here.
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Rsubread (Bioconductor, built from source)
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'install.packages("BiocManager"); BiocManager::install("Rsubread", ask = FALSE, update = FALSE)'
          Rscript -e 'cat("Rsubread", as.character(packageVersion("Rsubread")), "\n")'
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python tests/run_all.py upstream
