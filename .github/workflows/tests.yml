# Tests run at every push and pull request.
#   fast      (Linux)   : everything that does not need R (a mock Rscript stands in for DESeq2)
#   portable  (Windows) : the pure-Python tests (names and inputs, downloads, background jobs, publication)
# The tests that align reads with the real Rsubread are in upstream-tests.yml (longer).
name: tests

on:
  push:
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System tools (PDF text extraction used by the certificate tests)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python tests/run_all.py fast

  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python tests/run_all.py portable
        env:
          PYTHONUTF8: "1"
